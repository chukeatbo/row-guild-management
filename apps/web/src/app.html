<!doctype html>
<html lang="%lang%" data-theme="%theme%" data-theme-scope="%themeScope%">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
			rel="stylesheet"
		/>
		<script>
			// กัน flash: ตัดสิน theme ก่อน paint — แยก cookie ตามฝั่ง (ดู lib/theme.ts)
			// site (landing): site-theme ไม่มี = light · app (ระบบ): app-theme ไม่มี = dark · system = ตาม prefers-color-scheme
			(function () {
				var root = document.documentElement;
				var site = root.dataset.themeScope === 'site';
				var m = document.cookie.match(site ? /(?:^|; )site-theme=(light|dark|system)/ : /(?:^|; )app-theme=(light|dark|system)/);
				var pref = m ? m[1] : site ? 'light' : 'dark';
				var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
				root.dataset.theme = dark ? 'dark' : 'light';
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
